[package]
name = "photocraft-gen"
description = "Generative AI backends: OpenRouter image generation for generative fill"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "photocraft_gen"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots", "gzip"] }

[lints]
workspace = true
